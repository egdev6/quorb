name: macOS signed release prepare and submit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version of the existing Windows release
        required: true
        type: string
      source_sha:
        description: Full lowercase SHA of that release, ancestor of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release before signing approval
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.validate.outputs.sourceSha }}
      version: ${{ steps.validate.outputs.version }}
      release_id: ${{ steps.validate.outputs.releaseId }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate existing release
        id: validate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { preflightRelease } from './scripts/macos-release-preflight.mjs';
          const result = await preflightRelease();
          for (const [key, value] of Object.entries(result)) {
            appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
          }
          NODE

  signing:
    name: Prepare signed checkpoint and submit once, without waiting
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: macos-signing
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
    steps:
      - name: Checkout trusted verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout validated build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable

      - name: Require native ARM64 toolchains
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(node -p process.arch)" = arm64
          rustc -vV | grep -Fx 'host: aarch64-apple-darwin'

      - name: Install locked dependencies
        working-directory: source
        run: npm ci

      - name: Build and sign without any Tauri notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/macos-notary-checkpoint.mjs build

      - name: Verify signed app and signed DMG and create strict checkpoint
        run: node scripts/macos-notary-checkpoint.mjs stage

      - name: Retain immutable signed DMG and manifest BEFORE private key or submit
        id: checkpoint
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-notary-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: notary-checkpoint/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

      - name: Submit retained DMG once and record UUID, never wait or retry
        env:
          CHECKPOINT_ARTIFACT_ID: ${{ steps.checkpoint.outputs.artifact-id }}
          CHECKPOINT_ARTIFACT_DIGEST: ${{ steps.checkpoint.outputs.artifact-digest }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/macos-notary-submit.mjs

      - name: Retain submission receipt separately
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-notary-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: notary-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Remove private notarization key even on cancellation
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { unlinkSync } from 'node:fs';
          import path from 'node:path';
          const key = path.join(process.env.RUNNER_TEMP, 'quorb-notary-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT + '.p8');
          try { unlinkSync(key); }
          catch (error) { if (error.code !== 'ENOENT') throw new Error('Private key cleanup failed'); }
          NODE
