name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust format is clean
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Frontend and script tests
        run: npm test

      - name: i18n text inventory is up to date
        run: node scripts/i18n-inventory.mjs --check

      # Formatter version policy: deliberately mobile. Both workflows install
      # `stable` via dtolnay/rust-toolchain; `stable` is resolved at run time, so
      # a rustfmt update can change formatting without any repository change. If
      # this gate fails after a `stable` bump, run
      # `cargo fmt --manifest-path src-tauri/Cargo.toml --all` and land the diff
      # as a formatting-only commit (see CONTRIBUTING.md).

      - name: Typecheck and build
        run: npm run build

      - name: Rust tests with locked dependencies
        working-directory: src-tauri
        run: cargo test --locked
