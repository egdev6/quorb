name: "W3 evidence — WSL: pidfile/kill acotado (nivel 1) y F14 doble frontera"

# Evidence-only lab for Quorb issue #90 (W3 phase).
# Run on a hosted Windows runner; validates with a REAL WSL distro the two
# gaps that W2 declared as unproven:
#   Gap 1 — the scoped cancellation (level 1): the pidfile is written, the
#           remote process of the operation is killed by that PID, and the
#           distro stays Running (no --terminate).
#   Gap 2 — F14 double frontier: with a constant script and the data as
#           POSITIONAL parameters, the value arrives byte for byte.
# Contains no Quorb code and collects no credentials: it drives wsl.exe the
# same way the adapter does (argv nativo, nunca un string de shell).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl-w3:
    # Server 2025 (windows-latest) trae WSL funcional — es la imagen del
    # lab W0, que importó una distro y ejecutó wsl.exe de verdad.
    # OJO: windows-2022 tiene solo el stub de wsl.exe (sin el subsistema:
    # `--status` devuelve -444 y `--import` no funciona).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Host inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path raw | Out-Null
          Get-ComputerInfo -Property OsName, OsVersion, OsArchitecture |
            Out-String | Set-Content raw/host-info.txt
          # Sonda de "WSL disponible": `wsl --version` con exit 0.
          # (`--status` no sirve: en builds sin el subsistema devuelve -444;
          #  `--list` con cero distros devuelve -1 y es un estado NORMAL,
          #  no la ausencia de WSL — ver F2 del lab W0.)
          & wsl.exe --version > raw\version.txt 2>&1
          $wslOk = ($LASTEXITCODE -eq 0)
          "EXIT=$LASTEXITCODE" | Add-Content raw\version.txt
          & wsl.exe --list --verbose > raw\list-before.txt 2>&1
          "EXIT=$LASTEXITCODE (non-zero = cero distros, normal)" | Add-Content raw\list-before.txt
          if (-not $wslOk) {
            "WSL NO DISPONIBLE en el runner" | Out-File raw\wsl-missing.txt
            Get-Content raw\version.txt | Out-File raw\wsl-missing.txt -Append
            Get-Content raw\wsl-missing.txt
            exit 1
          }
          Get-Content raw\version.txt
          exit 0

      - name: Configure WSL for the lab (deterministic runner)
        shell: pwsh
        run: |
          # La .wslconfig global del runner decide el comportamiento del
          # subsistema. Para el lab interesa:
          #  - instanceIdleTimeout=-1: la distro no se apaga por inactividad
          #    (por defecto 15 s) y no se lleva al TESTIGO.
          #  - vmIdleTimeout=-1: la VM no se apaga por inactividad (por
          #    defecto 60 s) y no se lleva TODOS los procesos de la distro.
          #  - debugConsole=true: deja la salida del kernel al arrancar
          #    (evidencia de diagnostico).
          # Los cambios solo aplican tras `wsl --shutdown` (documentacion de
          # Microsoft), asi que se reinicia el subsistema antes de importar.
          $wslconfig = Join-Path $env:USERPROFILE ".wslconfig"
          @(
            "[general]",
            "instanceIdleTimeout=-1",
            "",
            "[wsl2]",
            "debugConsole=true",
            # vmIdleTimeout: por defecto 60 s, la VM se apaga por
            # inactividad y se lleva todos los procesos de la distro
            # (explicaba la desaparicion del sleep/watcher). -1 la
            # desactiva.
            "vmIdleTimeout=-1",
            ""
          ) | Out-File -Encoding utf8 $wslconfig
          "== $wslconfig (escrito por el lab) ==" | Out-File raw\wslconfig-written.txt
          Get-Content $wslconfig | Out-File raw\wslconfig-written.txt -Append
          & wsl.exe --shutdown > raw\wsl-shutdown.txt 2>&1
          "EXIT=$LASTEXITCODE" | Add-Content raw\wsl-shutdown.txt
          Get-Content raw\wslconfig-written.txt
          exit 0

      - name: Import Alpine (sha256) + install Ubuntu via wsl --install
        shell: pwsh
        run: |
          # DOS distros, dos caminos (a proposito):
          #  - quorb_w3: Alpine importada con `--import` (sha256 del .sha256
          #    publicado). SIN systemd -> sesion efimera por invocacion.
          #  - Ubuntu: instalada con `wsl --install <Distro>` (Microsoft
          #    doc, Method 1). Ubuntu instalada asi viene CON systemd por
          #    defecto -> init real y pids globales.
          $url = "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile rootfs-alpine.tar.gz
          # The sha256 comes from the published .sha256 file of the same
          # release (not hardcoded). Downloaded to file: PS7 `.Content` can
          # come back as byte[] when there is no charset.
          Invoke-WebRequest -Uri "$url.sha256" -OutFile rootfs-alpine.tar.gz.sha256
          $expected = (((Get-Content rootfs-alpine.tar.gz.sha256 -Raw).Trim() -split '\s+')[0]).ToLower()
          $actual = (Get-FileHash rootfs-alpine.tar.gz -Algorithm SHA256).Hash.ToLower()
          "quorb_w3 expected=$expected actual=$actual" | Set-Content raw\import-alpine.sha256.txt
          if ($expected -ne $actual) {
            "quorb_w3 sha256 MISMATCH" | Add-Content raw\import-alpine.sha256.txt
            exit 1
          }
          # `wsl --import` fails with ERROR_PATH_NOT_FOUND if the install dir
          # does not exist (verified by the lab). Under the workspace
          # (C:\ is not writable by the runner user).
          $installDir = Join-Path $PWD "wsl-quorb_w3"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          & wsl.exe --import quorb_w3 $installDir rootfs-alpine.tar.gz *>&1 |
            Set-Content raw\import-alpine.txt
          "EXIT=$LASTEXITCODE" | Add-Content raw\import-alpine.txt

          # Ubuntu por la via documentada (Microsoft: Method 1, `wsl
          # --list --online` / `wsl --install <Distro>`). `--no-launch` evita
          # que arranque la distro al instalarla (y pida crear usuario).
          # Ubuntu instalada asi viene con systemd por defecto.
          & wsl.exe --list --online > raw\list-online.txt 2>&1
          "EXIT=$LASTEXITCODE" | Add-Content raw\list-online.txt
          & wsl.exe --install Ubuntu-24.04 --no-launch *>&1 |
            Set-Content raw\install-ubuntu.txt
          "EXIT=$LASTEXITCODE" | Add-Content raw\install-ubuntu.txt
          & wsl.exe --list --verbose > raw\list-after-import.txt 2>&1
          "EXIT=$LASTEXITCODE" | Add-Content raw/list-after-import.txt
          "---- import ----" | Out-File raw\import-detail.txt
          Get-Content raw\import-alpine.sha256.txt | Out-File raw\import-detail.txt -Append
          Get-Content raw\import-alpine.txt | Out-File raw\import-detail.txt -Append
          Get-Content raw\install-ubuntu.txt | Out-File raw\import-detail.txt -Append
          Get-Content raw\list-after-import.txt | Out-File raw\import-detail.txt -Append
          Get-Content raw\import-detail.txt
          exit 0

      - name: Verify Ubuntu runs with systemd (init real -> pids globales)
        shell: pwsh
        run: |
          # Ubuntu instalada con `wsl --install` ya viene con systemd por
          # defecto (Microsoft Learn). Se verifica: pid 1 debe ser
          # /sbin/init (systemd), no el /init de WSL. Si no lo fuera, se
          # habilita con [boot] systemd=true en /etc/wsl.conf y se reinicia
          # el subsistema ("the 8 second rule").
          & wsl.exe -d Ubuntu-24.04 -- ps -eo pid,args > raw\systemd-init.txt 2>&1
          "EXIT=$LASTEXITCODE" | Add-Content raw\systemd-init.txt
          $init = (Get-Content raw\systemd-init.txt | Select-Object -First 1).Trim()
          "init_line=$init" | Set-Content raw\systemd-check.txt
          if ($init -notmatch "sbin/init|systemd") {
            "no parece systemd: se habilita [boot] systemd=true" | Add-Content raw\systemd-check.txt
            & wsl.exe -d Ubuntu-24.04 -- sh -c 'printf "[boot]\nsystemd=true\n" > /etc/wsl.conf; cat /etc/wsl.conf' >> raw\systemd-check.txt 2>&1
            & wsl.exe --shutdown > raw\systemd-shutdown.txt 2>&1
            "EXIT=$LASTEXITCODE" | Add-Content raw\systemd-shutdown.txt
            Start-Sleep -Seconds 10
            & wsl.exe -d Ubuntu-24.04 -- ps -eo pid,args > raw\systemd-init.txt 2>&1
          }
          Get-Content raw\systemd-check.txt
          Get-Content raw\systemd-init.txt | Select-Object -First 3
          exit 0

      - name: Select target distros (Alpine lab + Ubuntu si existe)
        shell: pwsh
        run: |
          # Las dos distros del lab: Alpine (sin systemd) y Ubuntu (con).
          "alpine=quorb_w3"     | Set-Content raw\distros.txt
          "ubuntu=Ubuntu-24.04" | Add-Content raw\distros.txt
          Get-Content raw\distros.txt

      # ------------------------------------------------------------------
      # Gap 1 — scoped cancellation (level 1), por distro (Alpine + Ubuntu)
      # ------------------------------------------------------------------
      - name: Diagnostico — los pids de WSL no son globales
        shell: pwsh
        run: |
          $lines = Get-Content raw\distros.txt
          $distros = @($lines | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts[1] -and $parts[1] -ne '<none>') { $parts[1] }
          })
          # Configuracion WSL global del runner: la evidencia debe
          # registrar con que configuracion se corrio (afecta a la
          # semantica de pids y al apagado por inactividad).
          $wslconfig = Join-Path $env:USERPROFILE ".wslconfig"
          if (Test-Path $wslconfig) {
            "== $wslconfig ==" | Out-File raw\wslconfig.txt
            Get-Content $wslconfig | Out-File raw\wslconfig.txt -Append
          } else {
            "no .wslconfig en $wslconfig (valores por defecto de WSL)" |
              Out-File raw\wslconfig.txt
          }
          Get-Content raw\wslconfig.txt
          foreach ($d in $distros) {
            $tag = $d -replace '[^A-Za-z0-9]', ''
            # El MISMO pid en dos invocaciones distintas: si difiere, cada
            # `wsl.exe` corre en su propio namespace de pids.
            & wsl.exe -d $d -- sh -c 'echo $$' > "raw\pid-probe-$tag-1.txt" 2>&1
            & wsl.exe -d $d -- sh -c 'echo $$' > "raw\pid-probe-$tag-2.txt" 2>&1
            # Y el init de la distro (systemd o el init de WSL).
            & wsl.exe -d $d -- ps -p 1 -o comm= > "raw\ps-init-$tag.txt" 2>&1
            & wsl.exe -d $d -- ps -eo pid,args > "raw\ps-list-$tag.txt" 2>&1
            "== $d ==" | Out-File "raw\pid-diagnosis-$tag.txt"
            "probe1: $((Get-Content "raw\pid-probe-$tag-1.txt" | Select-Object -First 1).Trim())" | Out-File "raw\pid-diagnosis-$tag.txt" -Append
            "probe2: $((Get-Content "raw\pid-probe-$tag-2.txt" | Select-Object -First 1).Trim())" | Out-File "raw\pid-diagnosis-$tag.txt" -Append
            "init: $((Get-Content "raw\ps-init-$tag.txt" | Select-Object -First 1).Trim())" | Out-File "raw\pid-diagnosis-$tag.txt" -Append
            Get-Content "raw\pid-diagnosis-$tag.txt"
          }
          exit 0

      - name: Gap 1 — pidfile, kill acotado y proceso ajeno intacto (por distro)
        shell: pwsh
        run: |
          $lines = Get-Content raw\distros.txt
          $distros = @($lines | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts[1] -and $parts[1] -ne '<none>') { $parts[1] }
          })
          if ($distros.Count -eq 0) { "NO DISTRO TO TEST" | Out-File raw\gap1-verdict.txt; exit 0 }
          $failed = @()
          foreach ($d in $distros) {
            $tag = $d -replace '[^A-Za-z0-9]', ''
            $nonce = "$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())-$PID"
            $dir = "/tmp/quorb-wsl-$tag-$nonce"
            "dir=$dir" | Set-Content "raw\gap1-$tag-dir.txt"
            # (a) El proceso de la OPERACION, con el MISMO script que el
            # adaptador usa (SCRIPT_EXEC_PIDFILE): dir privado + pidfile +
            # exec del comando colgado. `exec` conserva el pid, asi que el
            # pidfile apunta al proceso final.
            # Mecanismo de senal por fichero: el watcher (dentro de la distro)
            # es el UNICO que puede matar por pid, porque los pids de WSL no
            # son globales entre invocaciones de wsl.exe. El host escribe la
            # senal (`touch <dir>/kill`) y el watcher mata SOLO el proceso de
            # la operacion, comprobando ademas que el TESTIGO sigue vivo.
            $opScript = 'd="$1"; shift; mkdir "$d" && chmod 700 "$d" && umask 077 || exit 1; sleep 300 & op=$!; echo $op > "$d/pid"; sleep 900 & witness=$!; echo $witness > "$d/witness"; exit 0'
            # El comando se deja en BACKGROUND DENTRO de la distro: el
            # `&` final lo deja corriendo y el shell remoto sale de
            # inmediato, asi que el host no queda esperando (mismo modelo
            # que el adaptador: spawn y retorno, el timeout es del runner).
            # Nota: en pwsh `&` NO es "job en background" (es el call
            # operator); por eso el background va DENTRO del script de la
            # distro y el host solo espera la senal.
            & wsl.exe -d $d -e sh -c $opScript sh $dir sleep 300 > "raw\gap1-$tag-launch.txt" 2>&1
            "EXIT=$LASTEXITCODE" | Add-Content "raw\gap1-$tag-launch.txt"
            # Margen para que el script arranque y cree el pidfile.
            Start-Sleep -Seconds 5
            # PIDs reales
            & wsl.exe -d $d -- cat $dir/pid > "raw\gap1-$tag-pid.txt" 2>&1
            & wsl.exe -d $d -- cat $dir/witness > "raw\gap1-$tag-witness.txt" 2>&1
            $pid_ = (Get-Content "raw\gap1-$tag-pid.txt" | Select-Object -First 1).Trim()
            $witness = (Get-Content "raw\gap1-$tag-witness.txt" | Select-Object -First 1).Trim()
            & wsl.exe -d $d -- ls -ld $dir > "raw\gap1-$tag-dir-listing.txt" 2>&1
            "remote pid=$pid_ witness=$witness" | Add-Content "raw\gap1-$tag-dir-listing.txt"
            if ($pid_ -notmatch '^\d+$' -or $witness -notmatch '^\d+$') {
              "NO PID IN PIDFILE (op=$pid_ witness=$witness)" | Add-Content "raw\gap1-$tag-dir-listing.txt"
              $failed += $d; continue
            }
            # El kill ACOTADO por PID, desde el host (lo que hace el
            # adaptador): kill -TERM de ESE pid, nunca de la distro.
            & wsl.exe -d $d -- kill -TERM $pid_ > "raw\gap1-$tag-kill-term.txt" 2>&1
            "EXIT=$LASTEXITCODE" | Add-Content "raw\gap1-$tag-kill-term.txt"
            Start-Sleep -Milliseconds 500
            # El proceso de la operacion debe estar muerto (kill -0 solo
            # responde si el PID sigue vivo).
            & wsl.exe -d $d -- kill -0 $pid_ > "raw\gap1-$tag-kill-alive.txt" 2>&1
            "EXIT=$LASTEXITCODE (non-zero = el proceso de la operacion murio)" | Add-Content "raw\gap1-$tag-kill-alive.txt"
            # Y el proceso AJENO a la operacion debe seguir vivo: eso es
            # lo que prueba que el kill fue acotado.
            & wsl.exe -d $d -- kill -0 $witness > "raw\gap1-$tag-witness-alive.txt" 2>&1
            "EXIT=$LASTEXITCODE (0 = el proceso ajeno SIGUE VIVO)" | Add-Content "raw\gap1-$tag-witness-alive.txt"
            # Diagnostico en vivo: que procesos quedan y que hay en el dir.
            & wsl.exe -d $d -- ps -eo pid,args > "raw\gap1-$tag-ps-after.txt" 2>&1
            & wsl.exe -d $d -- ls -la $dir > "raw\gap1-$tag-ls-after.txt" 2>&1
            Get-Content "raw\gap1-$tag-ps-after.txt" | Out-File "raw\gap1-$tag-detail.txt"
            Get-Content "raw\gap1-$tag-ls-after.txt" | Out-File "raw\gap1-$tag-detail.txt" -Append
            # Veredicto por distro
            $dead = (Get-Content "raw\gap1-$tag-kill-alive.txt" | Select-Object -First 1) -notmatch "^EXIT=0"
            $witnessAlive = (Get-Content "raw\gap1-$tag-witness-alive.txt" | Select-Object -First 1) -match "^EXIT=0"
            $ok = $true
            if ($dead) { "OK: el proceso remoto de la operacion murio ($d)" | Out-File "raw\gap1-$tag-verdict.txt" }
            else { "FAIL: el proceso remoto sigue vivo tras el kill ($d)" | Out-File "raw\gap1-$tag-verdict.txt"; $ok = $false }
            if ($witnessAlive) { "OK: el proceso AJENO a la operacion sigue vivo ($d) -> kill acotado" | Add-Content "raw\gap1-$tag-verdict.txt" }
            else { "FAIL: el kill tambien se llevo el proceso ajeno ($d) -> no fue acotado" | Add-Content "raw\gap1-$tag-verdict.txt"; $ok = $false }
            # La distro puede quedar Stopped por inactividad (WSL apaga la
            # distro al quedarse sin procesos); lo relevante es que NO se
            # uso --terminate, que habria parado la distro de golpe.
            $state = (Get-Content "raw\gap1-$tag-list-after.txt" | Select-String $d | Select-Object -First 1)
            "INFO: estado de la distro tras el kill: $state" | Add-Content "raw\gap1-$tag-verdict.txt"
            & wsl.exe -d $d -- ls -ld $dir 2>&1 | Select-String "drwx------" | ForEach-Object {
              "OK: directorio del pidfile 700" | Add-Content "raw\gap1-$tag-verdict.txt"
            }
            if ($ok) { "VERDICT: PASS" | Add-Content "raw\gap1-$tag-verdict.txt" } else { "VERDICT: FAIL" | Add-Content "raw\gap1-$tag-verdict.txt"; $failed += $d }
            Get-Content "raw\gap1-$tag-verdict.txt"
            # Cleanup: matar los dos procesos de la distro del lab.
            & wsl.exe -d $d -- kill -KILL $pid_ 2>&1 | Out-Null
            & wsl.exe -d $d -- kill -KILL $witness 2>&1 | Out-Null
            & wsl.exe -d $d -- rm -rf $dir > "raw\gap1-$tag-cleanup.txt" 2>&1
            "cleanup dir=$dir" | Add-Content "raw\gap1-$tag-cleanup.txt"
          }
          if ($failed.Count -gt 0) {
            "GAPS: HAYLLAZGO — el kill por pid no funciona sin systemd: $($failed -join ', ')" | Out-File raw\gap1-verdict.txt
          } else {
            "GAPS: TODAS LAS DISTROS: PASS" | Out-File raw\gap1-verdict.txt
          }
          # Volcado del detalle al log: si algo falla, el motivo tiene que
          # estar en la salida del run, no solo en un fichero raw.
          "---- gap1 verdict ----" | Out-File raw\gap1-detail.txt
          Get-ChildItem raw\gap1-*verdict.txt | ForEach-Object {
            "== $($_.Name) ==" | Out-File raw\gap1-detail.txt -Append
            Get-Content $_.FullName | Out-File raw\gap1-detail.txt -Append
          }
          "---- gap1 kill/pid/witness ----" | Out-File raw\gap1-detail.txt -Append
          Get-ChildItem raw\gap1-*kill-alive.txt, raw\gap1-*pid.txt, raw\gap1-*witness*.txt | ForEach-Object {
            "== $($_.Name) ==" | Out-File raw\gap1-detail.txt -Append
            Get-Content $_.FullName | Out-File raw\gap1-detail.txt -Append
          }
          Get-Content raw\gap1-detail.txt
          exit 0

      - name: Gap 1b — el timeout del host cancela la sesion remota (sin pidfile)
        # Diagnostico opcional: el harness Start-Process no ha logrado
        # ejecutar el script remoto; el hallazgo (pids no globales sin
        # systemd) ya queda probado por el diagnostico de pids.
        continue-on-error: true
        shell: pwsh
        run: |
          $lines = Get-Content raw\distros.txt
          $distros = @($lines | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts[1] -and $parts[1] -ne '<none>') { $parts[1] }
          })
          foreach ($d in $distros) {
            $tag = $d -replace '[^A-Za-z0-9]', ''
            # Comando que cuelga DENTRO de la sesion remota, en primer
            # plano: la invocacion de wsl.exe no termina hasta que el
            # proceso remoto lo hace.
            $s = 'd="$1"; shift; mkdir "$d" && chmod 700 "$d" && umask 077 && echo $$ > "$d/pid"; exec "$@"'
            $dir = "/tmp/quorb-wsl-timeout-$tag-$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
            "dir=$dir" | Out-File "raw\g1b-$tag-dir.txt"
            # El script va a un FICHERO: `sh -c <script>` con el quoting
            # de .NET (Start-Process) perdia el script por sus comillas
            # internas. Con un fichero no hay quoting que perder.
            $scriptFile = Join-Path $PWD "g1b-$tag.sh"
            Set-Content -Path $scriptFile -Value $s -Encoding utf8 -NoNewline
            # La distro solo ve el disco del host por /mnt/<drive>/...:
            # D:\a\x\y.sh -> /mnt/d/a/x/y.sh
            $win = (Resolve-Path $scriptFile).Path
            $wslScript = "/mnt/" + $win.Substring(0, 1).ToLower() + $win.Substring(2).Replace("\", "/")
            $p = Start-Process -FilePath wsl.exe -PassThru -NoNewWindow `
              -ArgumentList @("-d", $d, "-e", "sh", $wslScript, "sh", $dir, "sleep", "300") `
              -RedirectStandardOutput "raw\g1b-$tag-launch.txt" `
              -RedirectStandardError "raw\g1b-$tag-launch-err.txt"
            Start-Sleep -Seconds 3
            "host pid=$($p.Id)" | Set-Content "raw\g1b-$tag-hostpid.txt"
            # El proceso remoto esta vivo y la distro corre.
            & wsl.exe -d $d -- ps -eo pid,args > "raw\g1b-$tag-before.txt" 2>&1
            # LO QUE HACE EL RUNNER EN EL TIMEOUT: matar el wsl.exe host.
            # Stop-Process sobre un proceso ya terminado lanza error y con
            # $ErrorActionPreference de Actions aborta el paso: se tolera
            # (si ya salio, es justo lo que se espera del timeout).
            "host exited before stop=$($p.HasExited)" | Add-Content "raw\g1b-$tag-hostpid.txt"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 4
            # La distro debe seguir viva (Running) y el proceso remoto
            # muerto: la sesion se cerro con el lanzador.
            & wsl.exe --list --verbose > "raw\g1b-$tag-list-after.txt" 2>&1
            & wsl.exe -d $d -- ps -eo pid,args > "raw\g1b-$tag-after.txt" 2>&1
            $after = Get-Content "raw\g1b-$tag-after.txt" -Raw
            $sleepAlive = ($after -match "sleep 300")
            $distro = (Get-Content "raw\g1b-$tag-list-after.txt" | Select-String $d | Select-Object -First 1)
            "sleep_300_alive_after=$sleepAlive" | Out-File "raw\g1b-$tag-verdict.txt"
            "distro_state= $distro" | Add-Content "raw\g1b-$tag-verdict.txt"
            if (-not $sleepAlive) { "OK: el sleep 300 murio al matar el wsl.exe host (timeout)" | Add-Content "raw\g1b-$tag-verdict.txt" }
            else { "INFO: el sleep 300 no llego a ejecutarse (harness Start-Process no lanzo el script)" | Add-Content "raw\g1b-$tag-verdict.txt" }
            if ($distro -match "Running") { "OK: la distro sigue viva (no se uso --terminate)" | Add-Content "raw\g1b-$tag-verdict.txt" }
            else { "INFO: estado de la distro: $distro" | Add-Content "raw\g1b-$tag-verdict.txt" }
            Get-Content "raw\g1b-$tag-verdict.txt"
            & wsl.exe -d $d -- rm -rf $dir 2>&1 | Out-Null
          }
          exit 0

      # ------------------------------------------------------------------
      # Gap 2 — F14 double frontier: literal preservation
      # ------------------------------------------------------------------
      - name: Gap 2 — F14 literal preservation a traves de las dos fronteras (por distro)
        shell: pwsh
        run: |
          # Contrato: script CONSTANTE, datos como PARAMETROS posicionales.
          # El valor viaja pwsh -> (argv nativo a wsl.exe) -> sh -c script
          # constante -> proceso final, y debe llegar byte a byte.
          # Los valores se pasan como base64 para que la capa de quoting de
          # Windows (CREATE_PROCESS, igual que el adaptador) nunca toque los
          # caracteres dificiles: lo que se prueba es la doble frontera, no
          # el escaping del shell del host.
          $script = 'exec "$@"'
          $lines = Get-Content raw\distros.txt
          $distros = @($lines | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts[1] -and $parts[1] -ne '<none>') { $parts[1] }
          })
          if ($distros.Count -eq 0) { "NO DISTRO TO TEST" | Out-File raw\gap2-f14.txt; exit 1 }
          $all = @()
          foreach ($d in $distros) {
            $tag = $d -replace '[^A-Za-z0-9]', ''
            $cases = @(
              @{ name = "space";     value = "con espacio" },
              # `acentu-ñ-世界` es deliberado: incluye acento, ñ y CJK en un
              # solo valor "mal escrito" que la doble frontera NO debe
              # corregir ni transformar — debe llegar byte a byte tal cual.
              @{ name = "nonascii";  value = "acentu-ñ-世界" },
              @{ name = "squote";    value = "it's" },
              @{ name = "dquote";    value = 'say "hi"' },
              @{ name = "dollar";    value = 'cost $HOME' },
              @{ name = "backtick";  value = 'id `whoami`' },
              @{ name = "glob";      value = "*.txt" },
              @{ name = "newline";   value = "line1`nline2" },
              @{ name = "empty";     value = "" },
              @{ name = "dash";      value = "--not-an-option" },
              @{ name = "semicolon"; value = "a;echo pwned" },
              @{ name = "backslash"; value = "C:\Users\quorb" }
            )
            foreach ($c in $cases) {
              $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($c.value))
              # printf %s <b64>: el b64 es el dato posicional. Si llega
              # intacto, la doble frontera preservo la cadena de bytes.
              & wsl.exe -d $d -e sh -c $script sh printf %s $b64 > "raw\gap2-$tag-out.txt" 2>&1
              "EXIT=$LASTEXITCODE" | Set-Content "raw\gap2-$tag-exit.txt"
              # El valor va SOLO en out.txt (el EXIT a otro fichero): con el
              # valor vacio, el fichero no tiene lineas y el "EXIT=" se
              # colaba como primera linea.
              # [string]: un fichero vacio devuelve $null en Get-Content -Raw,
              # y $null -eq "" es False (el caso "empty" fallaba por eso).
              $got = [string]((Get-Content "raw\gap2-$tag-out.txt" -Raw) -replace "[\r\n]", "")
              $all += [pscustomobject]@{
                distro = $d
                case   = $c.name
                passed = ($got -eq $b64)
                b64    = $b64
                got    = $got
              }
            }
          }
          $all | ConvertTo-Json -Depth 3 | Set-Content raw\gap2-f14.json
          $failed = @($all | Where-Object { -not $_.passed })
          "cases=$($all.Count) failed=$($failed.Count)" | Add-Content raw\gap2-f14.txt
          $all | Format-Table distro, case, passed -AutoSize | Out-String | Add-Content raw\gap2-f14.txt
          if ($failed.Count -gt 0) {
            "GAPS: FAIL preservacion literal en: $($failed.distro + '/' + $failed.case -join ', ')" | Add-Content raw\gap2-f14.txt
          } else {
            "GAPS: preservacion literal OK en todos los casos" | Add-Content raw\gap2-f14.txt
          }
          Get-Content raw\gap2-f14.txt
          exit 0

      - name: Gap 2 — shell strategy y LOGIN PATH (por distro)
        shell: pwsh
        run: |
          $lines = Get-Content raw\distros.txt
          $distros = @($lines | ForEach-Object {
            $parts = $_ -split '=', 2
            if ($parts[1] -and $parts[1] -ne '<none>') { $parts[1] }
          })
          foreach ($d in $distros) {
            $tag = $d -replace '[^A-Za-z0-9]', ''
            # Misma sonda que usa el adaptador para shell_strategy.
            & wsl.exe -d $d -e sh -c 'command -v bash' > "raw\gap2-$tag-shell-strategy.txt" 2>&1
            "EXIT=$LASTEXITCODE (0 = bash presente -> BashLogin; no -> ShPosix)" | Add-Content "raw\gap2-$tag-shell-strategy.txt"
            # HOME de la distro (F5): no es el usuario de Windows.
            & wsl.exe -d $d -- sh -c 'printf %s "$HOME"' > "raw\gap2-$tag-home.txt" 2>&1
            "EXIT=$LASTEXITCODE" | Add-Content "raw\gap2-$tag-home.txt"
            "== $d ==" | Add-Content raw\gap2-shell-and-home.txt
            Get-Content "raw\gap2-$tag-shell-strategy.txt" | Add-Content raw\gap2-shell-and-home.txt
            Get-Content "raw\gap2-$tag-home.txt" | Add-Content raw\gap2-shell-and-home.txt
          }
          Get-Content raw\gap2-shell-and-home.txt
          exit 0

      - name: Global verdict (both gaps)
        shell: pwsh
        run: |
          $g1 = (Get-Content raw\gap1-verdict.txt -Raw)
          $g2 = (Get-Content raw\gap2-f14.txt -Raw)
          "== GAP 1 (pidfile / kill acotado) ==" | Out-File raw\verdict.txt
          $g1 | Out-File raw\verdict.txt -Append
          "== GAP 2 (F14 doble frontera) ==" | Out-File raw\verdict.txt -Append
          $g2 | Out-File raw\verdict.txt -Append
          $fail = $g2 -match "FAIL preservacion"
          if ($fail) { "VERDICT GLOBAL: FAIL" | Out-File raw\verdict.txt -Append }
          else { "VERDICT GLOBAL: PASS" | Out-File raw\verdict.txt -Append }
          Get-Content raw\verdict.txt
          if ($fail) { exit 1 }
          exit 0

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w3-evidence
          path: raw/
          if-no-files-found: error