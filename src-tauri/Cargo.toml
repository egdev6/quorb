[package]
name = "quorb"
version = "0.8.0"
description = "Edge-docked usage rings for your AI subscriptions and APIs"
license = "MIT"
repository = "https://github.com/egdev6/quorb"
authors = ["Enrique Gómez Navarro <egdev6@gmail.com>"]
edition = "2021"

[lib]
name = "quorb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
chrono = { version = "0.4.35", features = ["serde"] }
futures = "0.3"
dirs = "6"
base64 = "0.22"
# Lectura (solo lectura) de la sesión local de Cursor
rusqlite = { version = "0.32", features = ["bundled"] }
# Windows Credential Manager (y Keychain / Secret Service en otros SO)
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

# Solo Windows: registro (PATH fresco) y Job Objects (contención del árbol de procesos).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-numerics = "=0.3.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Graphics_Effects", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Foundation", "System", "UI_Composition", "UI_Composition_Desktop",
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_WinRT",
    "Win32_System_WinRT_Composition", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Solo Unix: grupos de procesos para matar el árbol completo de un hijo.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Solo Linux: la superficie GTK del ciclo de colocación nativa (#179) y la
# sonda del backend GDK efectivo que de ella depende (#180, sonda única). La
# misma dependencia que ya resuelven tauri y tao (gtk 0.18 sin features): no
# sube el piso de GTK (3.22) ni añade crates nuevos.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Solo Linux: la prueba en vivo del ciclo (#179) con un webview real.
[target.'cfg(target_os = "linux")'.dev-dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
